<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f7f3e8" media="(prefers-color-scheme: light)" />
		<!--
			No font preloads: Vite fingerprints the fonts in src/lib/assets/fonts, so their built URLs
			are not known here, and a preload added from a layout would only run after the scripts load.
		-->
		<script>
			// Apply a stored theme choice before first paint. Without one, the system setting decides.
			// Same as site/public/index.html.
			(function () {
				try {
					var theme = localStorage.getItem('theme');
					if (theme !== 'light' && theme !== 'dark') return;
					document.documentElement.dataset.theme = theme;
					document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
						meta.content = theme === 'light' ? '#f7f3e8' : '#000000';
					});
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-primary font-body text-secondary antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
