<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f7f3e8" media="(prefers-color-scheme: light)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<!--
			No font preloads: Vite fingerprints the fonts in src/lib/assets/fonts, so their built URLs
			are not known here, and a preload added from a layout would only run after the scripts load.
		-->
		%sveltekit.head%
		<!--
			The stored theme, before first paint (static/theme.js). It comes after %sveltekit.head%,
			so the content security policy meta tag is in force before any script. No inline script:
			see src/csp.ts.
		-->
		<script src="/theme.js"></script>
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-primary font-body text-secondary antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
