# Publishes the teaser (site/) to GitHub Pages. PRs only run the build.
# Delete this file with site/ once the app is live on its new host (see plans/app-migration/plan.md).
name: Deploy teaser

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/AGENTS.md"
      - ".nvmrc"
      - ".github/workflows/deploy-pages.yml"
  # No paths filter: this is a required check, and a skipped required check blocks the PR forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  teaser-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: teaser-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
