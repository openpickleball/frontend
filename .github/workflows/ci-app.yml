# Checks formatting, lints, type-checks, tests and builds the SvelteKit app (app/), and runs its
# Playwright e2e tests. Never deploys.
name: App CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".nvmrc"
      - ".github/workflows/ci-app.yml"
  # No paths filter: this is a required check, and a skipped required check blocks the PR forever.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Each push to main
# gets its own group (its commit SHA), so no main run is cancelled.
concurrency:
  group: ci-app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# app-checks and app-e2e are both required status checks on main, so renaming either job
# must also update the main ruleset (plans/frontend-v1/plan.md, Q5).
jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install Chromium for the browser-mode component tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Check the generated API types match the schema snapshots
        run: |
          pnpm api:gen
          git diff --exit-code src/lib/api/generated
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      # Both Vitest projects (node and browser), then a coverage summary with no threshold.
      - run: pnpm test:coverage
      - run: pnpm build
      # The build above has PUBLIC_API_MOCK unset (off): it must ship no mock code (frontend#57),
      # and its index.html must carry one CSP meta tag that hashes every inline script.
      - run: pnpm check:build

  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # playwright.config.ts builds the app, serves it with `vite preview`, and sets PUBLIC_API_MOCK=all.
      - run: pnpm e2e
      # The PWA check needs a build with the mocks off (the worker never registers in mock modes),
      # so it builds again and serves on its own port.
      - run: pnpm e2e:pwa
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            app/playwright-report/
            app/playwright-report-pwa/
          retention-days: 7
