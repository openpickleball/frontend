<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OPEN Pickleball</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f3e8" media="(prefers-color-scheme: light)" />
    <!--
      GitHub Pages serves this file at whatever URL was missed, however deep, so relative
      links need a base. The site lives at the root of openpb.org.
    -->
    <base href="/" />
    <link rel="icon" href="assets/img/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <script>
      // Apply a stored theme choice before first paint. Without one, the system setting decides.
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") return;
          document.documentElement.dataset.theme = theme;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = theme === "light" ? "#f7f3e8" : "#000000";
          });
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body
    class="flex min-h-screen min-h-svh flex-col items-center justify-center bg-primary px-6 text-center font-body text-secondary antialiased"
  >
    <p
      class="-mr-[0.1em] font-display text-[clamp(42px,5.6vw,80px)] leading-none tracking-[0.1em]"
    >
      OPEN
    </p>
    <h1 class="mt-7 text-[clamp(20px,1.7vw,24px)] leading-[1.3] text-balance">
      This page doesn't exist.
    </h1>
    <a
      href="./"
      class="mt-5 inline-block text-[15px] underline underline-offset-4 hover:text-muted focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-current"
      >Go to the home page</a
    >
  </body>
</html>
